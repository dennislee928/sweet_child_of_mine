apiVersion: v1
kind: Pod
metadata:
  name: deny-no-limits
  namespace: exchange-sim
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
