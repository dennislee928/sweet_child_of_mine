apiVersion: v1
kind: Pod
metadata:
  name: deny-unsigned-image
  namespace: telemetry
spec:
  containers:
    - name: main
      image: ghcr.io/example/exchange-simulator:dev
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
