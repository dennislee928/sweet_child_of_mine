apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/example/exchange-simulator
    newName: exchange-simulator
    newTag: dev
  - name: ghcr.io/example/eve-forwarder
    newName: eve-forwarder
    newTag: dev
  - name: ghcr.io/example/indexer-worker
    newName: indexer-worker
    newTag: dev

patches:
  - target:
      kind: Deployment
      name: exchange-simulator
      namespace: telemetry
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: indexer-worker
      namespace: telemetry
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
