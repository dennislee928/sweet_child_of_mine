# Copy this overlay or edit newName/newTag to point at your registry.
# Example: ghcr.io/myorg/exchange-simulator and a release tag or digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/example/exchange-simulator
    newName: ghcr.io/example/exchange-simulator
    newTag: dev
  - name: ghcr.io/example/eve-forwarder
    newName: ghcr.io/example/eve-forwarder
    newTag: dev
  - name: ghcr.io/example/indexer-worker
    newName: ghcr.io/example/indexer-worker
    newTag: dev
