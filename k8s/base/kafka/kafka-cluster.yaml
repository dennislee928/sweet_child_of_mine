apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: exchange-kafka
  namespace: telemetry
spec:
  kafka:
    version: 4.1.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: '4.1'
    storage:
      type: ephemeral
  zookeeper:
    replicas: 3
    storage:
      type: ephemeral
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: exchange-app
  namespace: telemetry
  labels:
    strimzi.io/cluster: exchange-kafka
spec:
  authentication:
    type: scram-sha-512
