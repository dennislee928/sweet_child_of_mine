apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces/namespaces.yaml
  - kafka/kafka-cluster.yaml
  - kafka/topics.yaml
  - opensearch/opensearch.yaml
  - exchange-simulator/exchange-simulator.yaml
  - suricata/suricata.yaml
  - network-policies/cilium-policies.yaml

configMapGenerator:
  - name: suricata-rules
    files:
      - suricata/rules/local.rules
    options:
      disableNameSuffixHash: true

images:
  - name: ghcr.io/example/exchange-simulator
    newTag: dev
  - name: ghcr.io/example/eve-forwarder
    newTag: dev
  - name: ghcr.io/example/indexer-worker
    newTag: dev
