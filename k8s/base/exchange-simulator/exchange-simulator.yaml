apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-simulator-config
  namespace: telemetry
data:
  APP_NAME: exchange-simulator
  KAFKA_BOOTSTRAP_SERVERS: exchange-kafka-kafka-bootstrap.telemetry.svc.cluster.local:9093
  MARKET_EVENTS_TOPIC: market-events
  AUDIT_TOPIC: simulator-audit
  FIX_LISTEN_HOST: 0.0.0.0
  FIX_LISTEN_PORT: '9878'
  HTTP_PORT: '8080'
  SYMBOLS: BTC-USD,ETH-USD,SOL-USD,AAPL,TSLA,NVDA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-simulator
  namespace: telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exchange-simulator
  template:
    metadata:
      labels:
        app: exchange-simulator
    spec:
      containers:
        - name: exchange-simulator
          image: ghcr.io/example/exchange-simulator:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: exchange-simulator-config
          env:
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: KAFKA_SASL_USERNAME
              value: exchange-app
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: exchange-app
                  key: password
            - name: KAFKA_SSL_CA_LOCATION
              value: /etc/kafka/ca.crt
          volumeMounts:
            - name: kafka-cluster-ca
              mountPath: /etc/kafka
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
            - name: fix
              containerPort: 9878
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: kafka-cluster-ca
          secret:
            secretName: exchange-kafka-cluster-ca-cert
---
apiVersion: v1
kind: Service
metadata:
  name: exchange-simulator
  namespace: telemetry
spec:
  selector:
    app: exchange-simulator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: fix
      port: 9878
      targetPort: 9878
