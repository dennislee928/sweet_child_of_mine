apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-simulator-config
  namespace: exchange-sim
data:
  APP_NAME: exchange-simulator
  KAFKA_BOOTSTRAP_SERVERS: exchange-kafka-kafka-bootstrap.telemetry.svc.cluster.local:9092
  MARKET_EVENTS_TOPIC: market-events
  AUDIT_TOPIC: simulator-audit
  FIX_LISTEN_HOST: 0.0.0.0
  FIX_LISTEN_PORT: '9878'
  HTTP_PORT: '8080'
  SYMBOLS: BTC-USD,ETH-USD,SOL-USD,AAPL,TSLA,NVDA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange-simulator
  namespace: exchange-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exchange-simulator
  template:
    metadata:
      labels:
        app: exchange-simulator
    spec:
      containers:
        - name: exchange-simulator
          image: ghcr.io/example/exchange-simulator:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: exchange-simulator-config
          ports:
            - name: http
              containerPort: 8080
            - name: fix
              containerPort: 9878
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exchange-simulator
  namespace: exchange-sim
spec:
  selector:
    app: exchange-simulator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: fix
      port: 9878
      targetPort: 9878
