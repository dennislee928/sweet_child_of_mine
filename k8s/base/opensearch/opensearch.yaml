apiVersion: v1
kind: Secret
metadata:
  name: opensearch-auth
  namespace: telemetry
type: Opaque
stringData:
  # Replace before any non-lab deploy; used for admin user + Dashboards + indexer-worker.
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: ChangeMe_Strong_123!
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  namespace: telemetry
data:
  opensearch.yml: |
    cluster.name: exchange-honeynet
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: false
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: certs/node.pem
    plugins.security.ssl.http.pemkey_filepath: certs/node.key
    plugins.security.ssl.http.pemtrustedcas_filepath: certs/root-ca.pem
    plugins.security.ssl.transport.enabled: true
    plugins.security.ssl.transport.pemcert_filepath: certs/node.pem
    plugins.security.ssl.transport.pemkey_filepath: certs/node.key
    plugins.security.ssl.transport.pemtrustedcas_filepath: certs/root-ca.pem
    plugins.security.ssl.transport.enforce_hostname_verification: false
    plugins.security.ssl.http.clientauth_mode: OPTIONAL
    plugins.security.nodes_dn:
      - "CN=opensearch.telemetry.svc.cluster.local"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: telemetry
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      initContainers:
        - name: gen-certs
          image: alpine:3.19
          command:
            - sh
            - -ec
            - |
              apk add --no-cache openssl
              mkdir -p /out
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout /out/node.key -out /out/node.pem \
                -subj "/CN=opensearch.telemetry.svc.cluster.local"
              cp /out/node.pem /out/root-ca.pem
              chown 1000:1000 /out/node.key /out/node.pem /out/root-ca.pem
          volumeMounts:
            - name: opensearch-certs
              mountPath: /out
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.5.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9600
              name: perf
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms1g -Xmx1g
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-auth
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
            - name: config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
            - name: opensearch-certs
              mountPath: /usr/share/opensearch/config/certs
      volumes:
        - name: config
          configMap:
            name: opensearch-config
        - name: opensearch-certs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: telemetry
spec:
  selector:
    app: opensearch
  ports:
    - name: https
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboards
          image: opensearchproject/opensearch-dashboards:3.5.0
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: OPENSEARCH_HOSTS
              value: '["https://opensearch.telemetry.svc.cluster.local:9200"]'
            - name: OPENSEARCH_USERNAME
              value: admin
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-auth
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            - name: OPENSEARCH_SSL_VERIFICATIONMODE
              value: none
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: telemetry
spec:
  selector:
    app: opensearch-dashboards
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-worker
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer-worker
  template:
    metadata:
      labels:
        app: indexer-worker
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer-worker
          image: ghcr.io/example/indexer-worker:dev
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: exchange-kafka-kafka-bootstrap.telemetry.svc.cluster.local:9093
            - name: KAFKA_TOPICS
              value: market-events,simulator-audit,suricata-eve
            - name: KAFKA_GROUP_ID
              value: indexer-worker
            - name: KAFKA_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: KAFKA_SASL_USERNAME
              value: indexer-worker-user
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indexer-worker-user
                  key: password
            - name: KAFKA_SSL_CA_LOCATION
              value: /etc/kafka/ca.crt
            - name: OPENSEARCH_URL
              value: https://opensearch.telemetry.svc.cluster.local:9200
            - name: OPENSEARCH_USER
              value: admin
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-auth
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
            - name: OPENSEARCH_SSL_VERIFY
              value: "false"
          volumeMounts:
            - name: kafka-cluster-ca
              mountPath: /etc/kafka
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kafka-cluster-ca
          secret:
            secretName: exchange-kafka-cluster-ca-cert
        - name: tmp
          emptyDir: {}
