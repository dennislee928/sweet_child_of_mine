apiVersion: v1
kind: Secret
metadata:
  name: opensearch-auth
  namespace: telemetry
type: Opaque
stringData:
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: ChangeMe_Strong_123!
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  namespace: telemetry
data:
  opensearch.yml: |
    cluster.name: exchange-honeynet
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: telemetry
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.5.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9600
              name: perf
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms1g -Xmx1g
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
            - name: config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
      volumes:
        - name: config
          configMap:
            name: opensearch-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: telemetry
spec:
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
        - name: dashboards
          image: opensearchproject/opensearch-dashboards:3.5.0
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: OPENSEARCH_HOSTS
              value: '["http://opensearch.telemetry.svc.cluster.local:9200"]'
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: telemetry
spec:
  selector:
    app: opensearch-dashboards
  ports:
    - name: http
      port: 5601
      targetPort: 5601
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-worker
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: indexer-worker
  template:
    metadata:
      labels:
        app: indexer-worker
    spec:
      containers:
        - name: indexer-worker
          image: ghcr.io/example/indexer-worker:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: exchange-kafka-kafka-bootstrap.telemetry.svc.cluster.local:9092
            - name: KAFKA_TOPICS
              value: market-events,simulator-audit,suricata-eve
            - name: OPENSEARCH_URL
              value: http://opensearch.telemetry.svc.cluster.local:9200
