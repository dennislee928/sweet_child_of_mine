name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  app-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (exchange-simulator)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r apps/exchange-simulator/requirements.txt pytest ruff
          pytest apps/exchange-simulator/tests -q
          ruff check apps
          ruff format --check apps

  container-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local images
        run: |
          docker build -t local/exchange-simulator:ci apps/exchange-simulator
          docker build -t local/eve-forwarder:ci apps/eve-forwarder
          docker build -t local/indexer-worker:ci apps/indexer-worker
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: local/exchange-simulator:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  manifest-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Render overlays
        run: |
          kustomize build k8s/overlays/kind > /tmp/rendered-kind.yaml
          kustomize build k8s/overlays/dev > /tmp/rendered-dev.yaml
          kustomize build k8s/overlays/prod > /tmp/rendered-prod.yaml
      - name: Trivy config scan (rendered)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered-kind.yaml
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Build policy snapshots
        run: |
          mkdir -p /tmp/policy-snapshots
          awk '
            BEGIN {out=0}
            /^apiVersion:/ {
              if ($0 ~ /networking.k8s.io\/v1|cilium.io\/v2/) {out=1} else {out=0}
            }
            out {print}
          ' /tmp/rendered-kind.yaml > /tmp/policy-snapshots/kind-policies.yaml
          awk '
            BEGIN {out=0}
            /^apiVersion:/ {
              if ($0 ~ /networking.k8s.io\/v1|cilium.io\/v2/) {out=1} else {out=0}
            }
            out {print}
          ' /tmp/rendered-dev.yaml > /tmp/policy-snapshots/dev-policies.yaml
          awk '
            BEGIN {out=0}
            /^apiVersion:/ {
              if ($0 ~ /networking.k8s.io\/v1|cilium.io\/v2/) {out=1} else {out=0}
            }
            out {print}
          ' /tmp/rendered-prod.yaml > /tmp/policy-snapshots/prod-policies.yaml
      - name: Upload rendered manifests and policy snapshots
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests-and-policies
          path: |
            /tmp/rendered-kind.yaml
            /tmp/rendered-dev.yaml
            /tmp/rendered-prod.yaml
            /tmp/policy-snapshots/*.yaml
          if-no-files-found: error

  integration-smoke:
    runs-on: ubuntu-latest
    needs: [app-checks, container-checks, manifest-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Setup kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: exchange-honeynet
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Run smoke script
        env:
          OVERLAY: k8s/overlays/kind
          CREATE_KIND: "false"
        run: bash scripts/smoke.sh
      - name: Collect Cilium and Hubble diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/diag
          kubectl get pods -A > /tmp/diag/pods-all.txt || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp > /tmp/diag/events-all.txt || true
          kubectl get ciliumnetworkpolicies -A -o yaml > /tmp/diag/cilium-network-policies.yaml || true
          kubectl get networkpolicies -A -o yaml > /tmp/diag/network-policies.yaml || true
          kubectl -n telemetry get all > /tmp/diag/telemetry-all.txt || true
          cilium_pod="$(kubectl -n kube-system get pods -l k8s-app=cilium -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          relay_pod="$(kubectl -n kube-system get pods -l k8s-app=hubble-relay -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -n "${cilium_pod}" ]]; then
            kubectl -n kube-system logs "${cilium_pod}" --tail=400 > /tmp/diag/cilium.log || true
            kubectl -n kube-system exec "${cilium_pod}" -- cilium status > /tmp/diag/cilium-status.txt || true
            kubectl -n kube-system exec "${cilium_pod}" -- cilium endpoint list > /tmp/diag/cilium-endpoints.txt || true
          fi
          if [[ -n "${relay_pod}" ]]; then
            kubectl -n kube-system logs "${relay_pod}" --tail=400 > /tmp/diag/hubble-relay.log || true
          fi
          bash scripts/hubble-check.sh > /tmp/diag/hubble-check.txt 2>&1 || true
          bash scripts/ci-artifact-summary.sh /tmp/diag || true
      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-diagnostics
          path: /tmp/diag
          if-no-files-found: warn
