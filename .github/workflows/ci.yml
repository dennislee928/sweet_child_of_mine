name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  app-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (exchange-simulator)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r apps/exchange-simulator/requirements.txt pytest ruff
          pytest apps/exchange-simulator/tests -q
          ruff check apps
          ruff format --check apps

  container-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local images
        run: |
          docker build -t local/exchange-simulator:ci apps/exchange-simulator
          docker build -t local/eve-forwarder:ci apps/eve-forwarder
          docker build -t local/indexer-worker:ci apps/indexer-worker
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: local/exchange-simulator:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  manifest-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Render overlays
        run: |
          kustomize build k8s/overlays/kind > /tmp/rendered-kind.yaml
          kustomize build k8s/overlays/dev > /tmp/rendered-dev.yaml
          kustomize build k8s/overlays/prod > /tmp/rendered-prod.yaml
      - name: Trivy config scan (rendered)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered-kind.yaml
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Build policy snapshots
        run: |
          mkdir -p /tmp/policy-snapshots
          awk '
            BEGIN {out=0}
            /^apiVersion:/ {
              if ($0 ~ /networking.k8s.io\/v1|cilium.io\/v2/) {out=1} else {out=0}
            }
            out {print}
          ' /tmp/rendered-kind.yaml > /tmp/policy-snapshots/kind-policies.yaml
          awk '
            BEGIN {out=0}
            /^apiVersion:/ {
              if ($0 ~ /networking.k8s.io\/v1|cilium.io\/v2/) {out=1} else {out=0}
            }
            out {print}
          ' /tmp/rendered-dev.yaml > /tmp/policy-snapshots/dev-policies.yaml
          awk '
            BEGIN {out=0}
            /^apiVersion:/ {
              if ($0 ~ /networking.k8s.io\/v1|cilium.io\/v2/) {out=1} else {out=0}
            }
            out {print}
          ' /tmp/rendered-prod.yaml > /tmp/policy-snapshots/prod-policies.yaml
      - name: Upload rendered manifests and policy snapshots
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests-and-policies
          path: |
            /tmp/rendered-kind.yaml
            /tmp/rendered-dev.yaml
            /tmp/rendered-prod.yaml
            /tmp/policy-snapshots/*.yaml
          if-no-files-found: error

  integration-smoke:
    runs-on: ubuntu-latest
    needs: [app-checks, container-checks, manifest-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Setup kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: exchange-honeynet
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Run smoke script
        env:
          OVERLAY: k8s/overlays/kind
          CREATE_KIND: "false"
        run: bash scripts/smoke.sh
      - name: Collect Cilium and Hubble diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/diag
          kubectl get pods -A > /tmp/diag/pods-all.txt || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp > /tmp/diag/events-all.txt || true
          kubectl get ciliumnetworkpolicies -A -o yaml > /tmp/diag/cilium-network-policies.yaml || true
          kubectl get networkpolicies -A -o yaml > /tmp/diag/network-policies.yaml || true
          kubectl -n telemetry get all > /tmp/diag/telemetry-all.txt || true
          cilium_pod="$(kubectl -n kube-system get pods -l k8s-app=cilium -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          relay_pod="$(kubectl -n kube-system get pods -l k8s-app=hubble-relay -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -n "${cilium_pod}" ]]; then
            kubectl -n kube-system logs "${cilium_pod}" --tail=400 > /tmp/diag/cilium.log || true
            kubectl -n kube-system exec "${cilium_pod}" -- cilium status > /tmp/diag/cilium-status.txt || true
            kubectl -n kube-system exec "${cilium_pod}" -- cilium endpoint list > /tmp/diag/cilium-endpoints.txt || true
          fi
          if [[ -n "${relay_pod}" ]]; then
            kubectl -n kube-system logs "${relay_pod}" --tail=400 > /tmp/diag/hubble-relay.log || true
          fi
          tetragon_pod="$(kubectl -n kube-system get pods -l app=tetragon -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -n "${tetragon_pod}" ]]; then
            kubectl -n kube-system logs "${tetragon_pod}" --tail=400 > /tmp/diag/tetragon.log || true
            kubectl -n kube-system get pods -l app=tetragon -o wide > /tmp/diag/tetragon-pods.txt || true
          fi
          bash scripts/hubble-check.sh > /tmp/diag/hubble-check.txt 2>&1 || true
          bash scripts/ci-artifact-summary.sh /tmp/diag || true
      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-diagnostics
          path: /tmp/diag
          if-no-files-found: warn

  tenant-validation:
    runs-on: ubuntu-latest
    needs: [manifest-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Generate tenant rendered manifest
        run: |
          make tenant-create TENANT=alpha
          make tenant-create TENANT=beta
      - name: Trivy config scan (tenant rendered)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: k8s/tenants/alpha/rendered.yaml
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'
      - name: Setup kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: exchange-honeynet
      - name: Deploy base and tenant rendered
        run: |
          kustomize build k8s/overlays/kind > /tmp/rendered-kind.yaml
          kubectl apply -f /tmp/rendered-kind.yaml
          kubectl apply -f k8s/tenants/alpha/rendered.yaml
          kubectl apply -f k8s/tenants/beta/rendered.yaml
      - name: Install Kafka client for authz test
        run: |
          python3 -m pip install --user kafka-python
      - name: Tenant smoke and flow checks
        env:
          TENANT: alpha
          TENANT_ALLOW: alpha
          TENANT_DENY: beta
        run: |
          bash scripts/smoke.sh
          bash scripts/hubble-check.sh
      - name: Install Cosign for verify gate
        uses: sigstore/cosign-installer@v3.7.0
      - name: Verify signed digest images (best effort)
        run: |
          mkdir -p /tmp/tenant-diag
          if ! bash scripts/verify-deploy-images.sh k8s/tenants/alpha/rendered.yaml > /tmp/tenant-diag/cosign-verify.txt 2>&1; then
            echo "signature verification failed" >&2
            cat /tmp/tenant-diag/cosign-verify.txt || true
            exit 1
          fi
      - name: Cross-tenant Kafka authz deny check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          TENANT_ALLOW=alpha TENANT_DENY=beta bash scripts/kafka-cross-tenant-deny.sh

      - name: Collect tenant diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/tenant-diag
          kubectl get pods -A > /tmp/tenant-diag/pods-all.txt || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp > /tmp/tenant-diag/events-all.txt || true
          tetragon_pod="$(kubectl -n kube-system get pods -l app=tetragon -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -n "${tetragon_pod}" ]]; then
            kubectl -n kube-system logs "${tetragon_pod}" --tail=400 > /tmp/tenant-diag/tetragon.log || true
          fi
          bash scripts/ci-artifact-summary.sh /tmp/tenant-diag || true
      - name: Upload tenant diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-validation-diagnostics
          path: /tmp/tenant-diag
          if-no-files-found: warn

  admission-negative-tests:
    runs-on: ubuntu-latest
    needs: [manifest-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Setup kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: exchange-honeynet
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Apply base manifests with admission policies
        run: |
          kustomize build k8s/overlays/kind > /tmp/rendered-kind.yaml
          kubectl apply -f /tmp/rendered-kind.yaml
      - name: Verify deny manifests are blocked
        run: |
          set -euo pipefail
          for f in \
            tests/policy/deny-privileged.yaml \
            tests/policy/deny-latest.yaml \
            tests/policy/deny-no-limits.yaml \
            tests/policy/deny-no-readonly-rootfs.yaml \
            tests/policy/deny-allow-priv-esc.yaml; do
            echo "Expect deny: ${f}"
            if kubectl apply --dry-run=server -f "${f}"; then
              echo "ERROR: ${f} was not denied" >&2
              exit 1
            fi
          done
